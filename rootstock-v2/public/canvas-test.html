<!DOCTYPE html>
<html>
<head><title>Canvas Test</title></head>
<body style="margin:0; background: black;">
<h1 style="color:white; position:fixed; top:0; z-index:100;">Canvas Test - if you see an image below, canvas works</h1>
<canvas id="c" width="1280" height="720" style="width:100%; height:auto; border: 3px solid red;"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const img = new Image();
img.onload = () => {
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  document.title = 'LOADED: ' + img.naturalWidth + 'x' + img.naturalHeight;
};
img.onerror = () => { document.title = 'ERROR loading image'; };
img.src = '/mascot/First 10 seconds/ezgif-frame-100.jpg';
</script>
</body>
</html>
